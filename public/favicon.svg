import { motion } from 'framer-motion';

export function ModelCard({ model, index, onOpen }) {
  return (
    <motion.article
      className="pool-card"
      initial={{ opacity: 0, x: 40 }}
      whileInView={{ opacity: 1, x: 0 }}
      viewport={{ once: true, amount: 0.25 }}
      transition={{ duration: 0.55, delay: index * 0.08 }}
      whileHover={{ y: -8, scale: 1.01 }}
    >
      <div className="pool-card-image-wrap">
        <img src={model.image} alt={model.name} loading="lazy" />
      </div>
      <div className="pool-card-body">
        <div className="pool-card-top">
          <span className="tag">{model.type}</span>
          {model.priceLabel && <span className="price-label">{model.priceLabel}</span>}
        </div>
        <h3>{model.name}</h3>
        <div className="meta">
          <span>{model.dimensions}</span>
          {model.depth && <span>{model.depth}</span>}
        </div>
        <button type="button" className="btn btn-primary btn-small" onClick={onOpen}>
          VER MODELO
        </button>
      </div>
    </motion.article>
  );
}
